name: Build and deploy Agora Reconciliation app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, bcmath, openssl, dom, gd, simplexml, xml, xmlreader, xmlwriter, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Build frontend assets (Vite)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create storage symlink
        run: php artisan storage:link || true

      - name: Prepare deploy package
        run: |
          mkdir deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.devcontainer' \
            --exclude='infra' \
            --exclude='hostingstart.html' \
            ./ deploy/

          cd deploy
          zip -r ../app.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45C596F713724017B545964677821373 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_717678C703E446958CD58D7F82302A27 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_35F6613299DD4FE788FC444D2DB60CFA }}

      - name: Configure App Service PHP runtime
        run: |
          az webapp config set \
            --resource-group rg-php-mysql-prod \
            --name agora-laravel-mysql \
            --linux-fx-version 'PHP|8.4' \
            --output none

      - name: Clean deploy ZIP to Azure (CLI)
        run: |
          az webapp deploy \
            --resource-group rg-php-mysql-prod \
            --name agora-laravel-mysql \
            --src-path app.zip \
            --type zip \
            --clean true

      - name: Enforce App Service runtime and restart
        run: |
          set -euo pipefail

          az webapp config set \
            --resource-group rg-php-mysql-prod \
            --name agora-laravel-mysql \
            --startup-file 'bash /home/site/wwwroot/startup.sh || exit 1' \
            --always-on true \
            --output none

          az webapp restart \
            --resource-group rg-php-mysql-prod \
            --name agora-laravel-mysql

      - name: Verify application startup
        run: |
          set -euo pipefail

          host_name="$(az webapp show \
            --resource-group rg-php-mysql-prod \
            --name agora-laravel-mysql \
            --query defaultHostName \
            --output tsv)"

          sleep 15

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 5 "https://${host_name}/up" > /dev/null; then
              echo "Application startup verified."
              exit 0
            fi

            echo "Waiting for application startup (${attempt}/36)..."
            sleep 5
          done

          echo "Application did not become healthy after six minutes." >&2
          echo "Collecting the latest App Service container startup log..." >&2
          if ! az webapp log startup show \
            --resource-group rg-php-mysql-prod \
            --name agora-laravel-mysql; then
            echo "Unable to retrieve the App Service startup log." >&2
          fi
          exit 1
