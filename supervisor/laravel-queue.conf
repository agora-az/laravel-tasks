[program:laravel-queue-general]
command=/bin/bash -lc 'cd /home/site/wwwroot && php artisan queue:work database --queue=imports,default --sleep=1 --tries=1 --timeout=3600 --memory=512 --no-interaction'
directory=/home/site/wwwroot
numprocs=%(ENV_QUEUE_GENERAL_WORKERS)s
process_name=%(program_name)s-%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3610
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/site/wwwroot/storage/logs/queue-general-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/home/site/wwwroot/storage/logs/queue-general-error-%(process_num)02d.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

