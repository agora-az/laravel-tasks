[program:laravel-scheduler]
command=/bin/bash -lc 'cd /home/site/wwwroot && php artisan schedule:work --no-interaction'
directory=/home/site/wwwroot
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/site/wwwroot/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/home/site/wwwroot/storage/logs/scheduler-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
